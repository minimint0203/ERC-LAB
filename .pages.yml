# Pages CMS 설정 — https://app.pagescms.org 에서 깃허브로 로그인하면 아래 항목을 폼으로 수정할 수 있습니다.
# 저장하면 data 폴더의 JSON 파일이 커밋되고, 1~2분 뒤 사이트에 반영됩니다.

media:
  input: images
  output: /images

content:
  - name: notices
    label: 연구실 소식 · 공지사항
    type: file
    path: data/notices.json
    format: json
    list: true
    fields:
      - name: date
        label: 날짜
        type: date
        options:
          format: yyyy-MM-dd
      - name: title
        label: 제목
        type: string
        required: true
      - name: body
        label: 내용
        type: text

  - name: photos
    label: 연구실 소식 · 사진
    type: file
    path: data/photos.json
    format: json
    list: true
    fields:
      - name: date
        label: 날짜
        type: date
        options:
          format: yyyy-MM-dd
      - name: title
        label: 제목
        type: string
        required: true
      - name: images
        label: 사진
        description: 여러 장을 올리면 첫 번째 사진이 대표 사진이 됩니다.
        type: image
        options:
          path: images/news
          multiple:
            max: 20
      - name: caption
        label: 설명
        type: text

  - name: papers
    label: 연구 성과 · 논문
    type: file
    path: data/papers.json
    format: json
    list: true
    fields:
      - name: year
        label: 발표 연도
        type: number
        required: true
      - name: title
        label: 논문 제목
        type: string
        required: true
      - name: authors
        label: 저자
        description: 논문 원문 표기 그대로, 쉼표로 구분해서 입력하세요. 교수님 이름(Jong-Hwan Park)은 자동으로 굵게 표시됩니다.
        type: text
      - name: journal
        label: 학술지
        type: string
      - name: doi
        label: DOI
        description: "예: 10.1016/j.eti.2026.105023 (https://doi.org/ 는 빼고 입력)"
        type: string
      - name: category
        label: 분류
        type: select
        options:
          values:
            - 국제전문학술지(SCI급)
            - 국제일반학술지
            - 국내전문학술지(KCI등재)
            - 국내전문학술지(KCI등재후보)
            - 기타

  - name: projects
    label: 연구 성과 · 연구과제
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: start
        label: 시작 (YYYY.MM)
        type: string
        required: true
        pattern:
          regex: "^\\d{4}\\.\\d{2}$"
          message: "2026.04 형식으로 입력하세요"
      - name: end
        label: 종료 (YYYY.MM)
        description: 진행 중이면 비워두세요. "현재"로 표시됩니다.
        type: string
      - name: title
        label: 과제명
        type: string
        required: true
      - name: agency
        label: 지원 기관
        type: string
      - name: lead
        label: 주관 과제
        type: boolean

  - name: patents
    label: 연구 성과 · 특허
    type: file
    path: data/patents.json
    format: json
    list: true
    fields:
      - name: year
        label: 출원 연도
        type: number
        required: true
      - name: title
        label: 특허명
        type: string
        required: true

  - name: members
    label: 구성원
    type: file
    path: data/members.json
    format: json
    list: true
    fields:
      - name: group
        label: 과정
        type: select
        required: true
        options:
          values:
            - 박사과정
            - 석사과정
            - 학부연구생
            - 졸업생
      - name: name
        label: 이름
        type: string
        required: true
      - name: name_en
        label: 영문 이름
        type: string
      - name: photo
        label: 사진
        description: 세로 사진(약 3:4)이 잘 맞습니다.
        type: image
        options:
          path: images/members
      - name: dept
        label: 소속
        type: string
      - name: dept_en
        label: 영문 소속
        type: string
      - name: research
        label: 연구 소개
        type: text
      - name: achievements
        label: 수상·업적
        type: string
        list: true
